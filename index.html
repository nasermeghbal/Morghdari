<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sepid Goosht</title>
<style>
body{margin:0;background:#071412;color:#eef8f5;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:14px}.box{background:#0c211e;border:1px solid #1d3a35;border-radius:18px;padding:16px;margin-bottom:12px}
h1,h2,h3{margin-top:0}.muted{color:#91aaa5;font-size:12px}
.nav{display:flex;gap:7px;overflow:auto;margin:12px 0}.nav button,.btn{border:1px solid #1d3a35;background:#102925;color:#fff;border-radius:10px;padding:10px 13px;white-space:nowrap}
.nav button.active,.primary{background:#159b82;border-color:#159b82}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.metric{font-size:24px;font-weight:bold;margin-top:6px}.label{font-size:12px;color:#91aaa5}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}
label{display:block;font-size:11px;color:#91aaa5;margin-bottom:4px}
input,select{width:100%;padding:10px;border-radius:9px;border:1px solid #1d3a35;background:#071613;color:#fff}
.table{width:100%;border-collapse:collapse;min-width:650px}.scroll{overflow:auto}.table th,.table td{padding:9px;border-bottom:1px solid #1d3a35;font-size:12px;text-align:right}
.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{background:#481d1d}.about{text-align:center;color:#91aaa5;font-size:11px;padding:12px}
#login{position:fixed;inset:0;background:#03100e;display:grid;place-items:center;z-index:5}.loginbox{width:min(390px,90%);background:#0c211e;border:1px solid #1d3a35;border-radius:20px;padding:24px}.hidden{display:none}

<body>
<main id="app" class="wrap">
<div class="box" style="display:flex;justify-content:space-between;align-items:center">
<div><h1>🐔 سپید گوشت</h1><span class="muted">مدیریت حرفه‌ای فارم</span></div>
<div><span id="today"></span><div class="actions" style="margin-top:8px">
<button class="btn primary" onclick="createNewPeriod()">➕ ایجاد دوره جدید</button>
<select id="periodSelect" class="input" onchange="switchPeriod(this.value)" style="margin-right:6px">
<option value="">انتخاب دوره</option>
</select>
</div>
<button class="btn primary" onclick="backupData()">💾 پشتیبان‌گیری</button>
<button class="btn" onclick="document.getElementById("restoreFile").click()">♻️ بازیابی</button>
<input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)">
</div></div>
</div>
<div id="nav" class="nav"></div>
<section id="view"></section>
<div class="about">Sepid Goosht Poultry Management | Version 1.5.1 | Developed by Naser Jafarzadeh | © 2026 Naser Jafarzadeh</div>
</main>

<script>
const KEY="sepid_goosht_v1";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{flock:[],stockIn:[],stockOut:[],sales:[],expenses:[],partners:[],receipts:[]};
const pages=[
["dash","🏠 داشبورد"],["flock","🐔 گله و تلفات"],["stock","🌾 انبار و دان"],["sales","🚚 فروش"],
["finance","💰 مالی"],["partners","👥 شرکا"],["receipts","💳 دریافتی‌ها"],["reports","📊 گزارش‌ها"],["about","ℹ️ About"]
];
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function today(){return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function money(x){return (+x||0).toLocaleString("fa-IR")+" ریال"}
function uid(){return Date.now()+Math.random()}
function nav(active){navEl=document.getElementById("nav");navEl.innerHTML=pages.map(p=>`<button class="${p[0]==active?"active":""}" onclick="show('${p[0]}')">${p[1]}</button>`).join("")}
function field(id,label,type="text"){return `<div><label>${label}</label><input id="${id}" type="${type}"></div>`}
function edit(arr,id){let x=db[arr].find(v=>String(v.id)==String(id));if(!x)return;Object.keys(x).filter(k=>k!="id").forEach(k=>{let v=prompt(k,x[k]);if(v!==null)x[k]=v});save()}
function del(arr,id){if(confirm("این رکورد حذف شود؟")){db[arr]=db[arr].filter(x=>String(x.id)!=String(id));save()}}
function tbl(arr,heads,cols){let a=db[arr];if(!a.length)return '<p class="muted">رکوردی ثبت نشده است.</p>';return `<div class="scroll"><table class="table"><tr>${heads.map(h=>`<th>${h}</th>`).join("")}<th>عملیات</th></tr>${a.map(x=>`<tr>${cols.map(c=>`<td>${x[c]??""}</td>`).join("")}<td class="actions"><button class="btn" onclick="edit('${arr}','${x.id}')">ویرایش</button><button class="btn danger" onclick="del('${arr}','${x.id}')">حذف</button></td></tr>`).join("")}</table></div>`}
function show(p){nav(p);let f={dash,dashboard:dash,flock,stock,sales,finance,partners,receipts,reports,about}[p]||dash;view.innerHTML=f()}
function dash(){
let initial=db.flock.reduce((s,x)=>s+(+x.initial||0),0),mort=db.flock.reduce((s,x)=>s+(+x.mort||0)+(+x.initialMort||0),0),live=Math.max(0,initial-mort);
let feed=db.flock.reduce((s,x)=>s+(+x.feed||0),0),sale=db.sales.reduce((s,x)=>s+(+x.amount||0),0),cost=db.expenses.reduce((s,x)=>s+(+x.amount||0),0);
return `<div class="box"><h2>امروز ${today()} 🌱</h2><p class="muted">صبح بخیر؛ خلاصه وضعیت فارم سپید گوشت</p></div>
<div class="grid">${[["موجودی کل گله",live+" قطعه"],["جمع کل تلفات",mort+" قطعه"],["درصد بقا",initial?(live/initial*100).toFixed(1)+"%":"0%"],["دان مصرفی کل",(feed/1000).toFixed(2)+" تن"],["فروش کل",money(sale)],["هزینه کل",money(cost)],["ضریب کل مرغداری",fcr().toFixed(3)]].map(a=>`<div class="box"><div class="label">${a[0]}</div><div class="metric">${a[1]}</div></div>`).join("")}</div>
<div class="box"><h3>ضریب ۴ سالن</h3><div class="grid">${[1,2,3,4].map(h=>`<div><b>سالن ${h}</b><div class="metric">${hallFcr(h).toFixed(3)}</div></div>`).join("")}</div></div>`}
function fcr(){let feed=db.flock.reduce((s,x)=>s+(+x.feed||0),0),gain=db.flock.reduce((s,x)=>s+(+x.chicks||0)*(+x.weight||0),0);return gain?feed/gain:0}
function hallFcr(h){let a=db.flock.filter(x=>x.hall=="سالن "+h),feed=a.reduce((s,x)=>s+(+x.feed||0),0),gain=a.reduce((s,x)=>s+(+x.chicks||0)*(+x.weight||0),0);return gain?feed/gain:0}
function flock(){return `<div class="box"><h2>گله و تلفات</h2><div class="form">
${field("fd","تاریخ شمسی")}${field("hall","سالن")}${field("initial","تعداد جوجه اولیه","number")}${field("initialMort","تلفات اولیه مسیر","number")}
${field("chicks","موجودی سالن","number")}${field("weight","میانگین وزن kg","number")}${field("mort","تلفات روزانه","number")}${field("feed","دان مصرفی kg","number")}${field("day","روز دوره","number")}${field("med","دارو / واکسن")}${field("medq","مقدار","number")}</div>
<button class="btn primary" style="margin-top:10px" onclick="addFlock()">ثبت</button></div>
<div class="box"><h3>سوابق تلفات، وزن و مصرف دان</h3>${tbl("flock",["تاریخ","سالن","وزن","تلفات","دان","روز"],["fd","hall","weight","mort","feed","day"])}</div>`}
function addFlock(){db.flock.push({id:uid(),fd:fd.value||today(),hall:hall.value||"سالن 1",initial:+initial.value||0,initialMort:+initialMort.value||0,chicks:+chicks.value||0,weight:+weight.value||0,mort:+mort.value||0,feed:+feed.value||0,day:+day.value||0,med:med.value,medq:+medq.value||0});save()}
function stock(){let names=[...new Set(db.stockIn.map(x=>x.item))];return `<div class="box"><h2>انبار و دان</h2><h3>ورود به انبار</h3><div class="form">${field("si","نوع کالا")}${field("sb","برند")}${field("sq","وزن kg","number")}${field("sp","قیمت ریال","number")}${field("sd","تاریخ شمسی")}</div><button class="btn primary" style="margin-top:10px" onclick="addIn()">ثبت ورود</button>
<h3>مصرف از انبار</h3><div class="form">${field("so","نوع کالا")}${field("oq","مقدار مصرف kg","number")}${field("od","تاریخ شمسی")}</div><button class="btn primary" style="margin-top:10px" onclick="addOut()">ثبت مصرف</button></div>
<div class="grid">${names.map(n=>{let i=db.stockIn.filter(x=>x.item==n).reduce((s,x)=>s+(+x.qty||0),0),o=db.stockOut.filter(x=>x.item==n).reduce((s,x)=>s+(+x.qty||0),0);return `<div class="box"><div class="label">${n}</div><div class="metric">${(i-o).toLocaleString("fa-IR")} kg</div><div class="muted">مجموع مصرفی: ${o.toLocaleString("fa-IR")} kg</div></div>`}).join("")}</div>
<div class="box"><h3>ورودی‌های انبار</h3>${tbl("stockIn",["نوع کالا","برند","وزن","قیمت","تاریخ"],["item","brand","qty","price","date"])}</div>
<div class="box"><h3>مصرفی‌ها</h3>${tbl("stockOut",["نوع کالا","مقدار","تاریخ"],["item","qty","date"])}</div>`}
function addIn(){db.stockIn.push({id:uid(),item:si.value,brand:sb.value,qty:+sq.value||0,price:+sp.value||0,date:sd.value||today()});save()}
function addOut(){db.stockOut.push({id:uid(),item:so.value,qty:+oq.value||0,date:od.value||today()});save()}
function sales(){return `<div class="box"><h2>فروش</h2><div class="form">${field("st","نوع فروش (مرغ زنده / کود)")}${field("sdate","تاریخ شمسی")}${field("ticket","شماره قبض")}${field("empty","وزن خالی kg","number")}${field("full","وزن پر kg","number")}${field("vehicle","نوع خودرو")}${field("plate","پلاک")}${field("driver","راننده")}${field("dphone","تماس راننده")}${field("dest","مقصد")}${field("buyer","خریدار")}${field("hallS","شماره سالن")}${field("cage","شماره قفس")}${field("cageN","تعداد در قفس","number")}${field("birds","تعداد مرغ","number")}${field("amount","مبلغ ریال","number")}</div><button class="btn primary" style="margin-top:10px" onclick="addSale()">ثبت فروش</button></div>
<div class="box">${tbl("sales",["نوع","تاریخ","قبض","خالص kg","خریدار","تعداد","مبلغ"],["st","sdate","ticket","net","buyer","birds","amount"])}</div>`}
function addSale(){db.sales.push({id:uid(),st:st.value,sdate:sdate.value||today(),ticket:ticket.value,net:(+full.value||0)-(+empty.value||0),buyer:buyer.value,birds:+birds.value||0,amount:+amount.value||0,empty:+empty.value||0,full:+full.value||0,vehicle:vehicle.value,plate:plate.value,driver:driver.value,dphone:dphone.value,dest:dest.value,hall:hallS.value,cage:cage.value,cageN:+cageN.value||0});save()}
function finance(){return `<div class="box"><h2>مالی و هزینه‌ها</h2><div class="form">${field("et","عنوان هزینه")}${field("ec","دسته")}${field("ea","مبلغ ریال","number")}${field("ep","شریک")}${field("ed","تاریخ شمسی")}</div><button class="btn primary" style="margin-top:10px" onclick="addExp()">ثبت هزینه</button></div><div class="box">${tbl("expenses",["عنوان","دسته","مبلغ","شریک","تاریخ"],["title","cat","amount","partner","date"])}</div>`}
function addExp(){db.expenses.push({id:uid(),title:et.value,cat:ec.value,amount:+ea.value||0,partner:ep.value,date:ed.value||today()});save()}
function partners(){return `<div class="box"><h2>شرکا</h2><div class="form">${field("pn","نام شریک")}${field("pp","شماره تماس")}${field("pc","آورده اولیه ریال","number")}</div><button class="btn primary" style="margin-top:10px" onclick="addP()">ثبت شریک</button></div><div class="box">${tbl("partners",["نام","تماس","آورده اولیه"],["name","phone","capital"])}</div>`}
function addP(){db.partners.push({id:uid(),name:pn.value,phone:pp.value,capital:+pc.value||0});save()}
function receipts(){return `<div class="box"><h2>دریافتی‌ها</h2><div class="form">${field("rp","شریک")}${field("rf","دریافت از")}${field("ra","مبلغ ریال","number")}${field("rd","تاریخ شمسی")}${field("rn","توضیحات")}</div><button class="btn primary" style="margin-top:10px" onclick="addR()">ثبت دریافتی</button></div><div class="box">${tbl("receipts",["شریک","از","مبلغ","تاریخ","توضیحات"],["partner","from","amount","date","note"])}</div>`}
function addR(){db.receipts.push({id:uid(),partner:rp.value,from:rf.value,amount:+ra.value||0,date:rd.value||today(),note:rn.value});save()}
function reports(){let total=db.expenses.reduce((s,x)=>s+(+x.amount||0),0);return `<div class="grid"><div class="box"><div class="label">جمع هزینه</div><div class="metric">${money(total)}</div></div><div class="box"><div class="label">جمع فروش</div><div class="metric">${money(db.sales.reduce((s,x)=>s+(+x.amount||0),0))}</div></div></div><div class="box"><h3>هزینه هر شریک</h3>${db.partners.map(p=>`<p>${p.name}: <b>${money(db.expenses.filter(e=>e.partner==p.name).reduce((s,x)=>s+(+x.amount||0),0))}</b></p>`).join("")}</div><button class="btn primary" onclick="window.print()">خروجی PDF / چاپ</button>`}
function about(){return `<div class="box" style="text-align:center;padding:45px"><h1>Sepid Goosht Poultry Management</h1><p class="muted">Professional Poultry Farm Management System</p><p><b>Version 1.5.1</b></p><p>Developed by <b>Naser Jafarzadeh</b></p><p>© 2026 Naser Jafarzadeh</p></div>`}

function backupData(){
  try{
    const payload={
      app:"Sepid Goosht Poultry Management",
      version:"1.2.0",
      createdAt:new Date().toISOString(),
      data:db
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const d=new Date();
    const stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    a.href=url;
    a.download="Sepid_Goosht_Backup_"+stamp+".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    alert("پشتیبان‌گیری انجام شد و فایل Backup روی گوشی ذخیره/دانلود شد.");
  }catch(e){
    alert("پشتیبان‌گیری انجام نشد.");
  }
}
function restoreData(ev){
  const file=ev.target.files && ev.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const payload=JSON.parse(reader.result);
      const restored=payload && payload.data ? payload.data : payload;
      if(!restored || typeof restored!=="object" || !Array.isArray(restored.flock)){
        throw new Error("invalid");
      }
      if(!confirm("اطلاعات فعلی با این Backup جایگزین شود؟")) return;
      db=restored;
      save();
      alert("بازیابی اطلاعات با موفقیت انجام شد.");
    }catch(e){
      alert("فایل Backup معتبر نیست.");
    }finally{
      ev.target.value="";
    }
  };
  reader.readAsText(file);
}
function render(){todayEl=document.getElementById("today");todayEl.textContent=today();show("dash")}
populatePeriods();
render();
</script>

if(!/^14\d{2}\/(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])$/.test(date)){alert("تاریخ را به شکل ۱۴۰۵/۰۵/۲۳ وارد کنید");return;}

<style>
.pcal-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:10000}
.pcal{width:min(390px,94vw);background:#151a21;border:1px solid #394454;border-radius:18px;padding:16px;color:#fff}
.pcal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pcal-head button,.pcal-grid button{background:#202733;color:#fff;border:1px solid #394454;border-radius:8px}
.pcal-head button{padding:7px 13px}
.pcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pcal-grid button{min-height:38px}
.pcal-week{text-align:center;opacity:.7;font-size:12px;padding:4px}
</style>
<div id="persianCalendarModal" class="pcal-modal">
<div class="pcal">
<div class="pcal-head"><button onclick="pcalPrev()">‹</button><b id="pcalTitle"></b><button onclick="pcalNext()">›</button></div>
<div class="pcal-grid" id="pcalGrid"></div>
<button onclick="pcalClose()" style="margin-top:10px;padding:9px 20px;border:0;border-radius:8px">انصراف</button>
</div></div>
<script>
let pcalTarget=null,pcalYear=1405,pcalMonth=1;
const pcalMonths=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const pcalWeek=["ش","ی","د","س","چ","پ","ج"];
function pcalDays(y,m){return m<=6?31:m<=11?30:((y%4===3)?30:29)}
function pcalWeekday(y,m,d){
 let n=0; for(let yy=1403;yy<y;yy++)n+=yy%4===3?366:365;
 for(let mm=1;mm<m;mm++)n+=pcalDays(y,mm);
 return (3+n+d-1)%7;
}
function pcalRender(){
 const g=document.getElementById("pcalGrid");g.innerHTML="";
 document.getElementById("pcalTitle").textContent=pcalMonths[pcalMonth-1]+" "+pcalYear;
 pcalWeek.forEach(x=>{let e=document.createElement("div");e.className="pcal-week";e.textContent=x;g.appendChild(e)});
 for(let i=0;i<pcalWeekday(pcalYear,pcalMonth,1);i++)g.appendChild(document.createElement("div"));
 for(let d=1;d<=pcalDays(pcalYear,pcalMonth);d++){
  let b=document.createElement("button");b.textContent=d;
  b.onclick=()=>{if(pcalTarget)pcalTarget.value=pcalYear+"/"+String(pcalMonth).padStart(2,"0")+"/"+String(d).padStart(2,"0");pcalClose()};
  g.appendChild(b);
 }
}
function openJalaliPicker(el){
 pcalTarget=el;
 let m=(el.value||"").match(/^(14\d{2})\/(\d{1,2})\/(\d{1,2})$/);
 pcalYear=m?+m[1]:1405;pcalMonth=m?+m[2]:1;
 document.getElementById("persianCalendarModal").style.display="flex";pcalRender();
}
function pcalClose(){document.getElementById("persianCalendarModal").style.display="none";pcalTarget=null}
function pcalPrev(){if(--pcalMonth<1){pcalMonth=12;pcalYear--}pcalRender()}
function pcalNext(){if(++pcalMonth>12){pcalMonth=1;pcalYear++}pcalRender()}

function createNewPeriod(){
  var old=document.getElementById("newPeriodModal");
  if(old) old.remove();
  var m=document.createElement("div");
  m.id="newPeriodModal";m.className="jalali-modal";m.style.display="flex";
  var box=document.createElement("div");
  box.className="jalali-box";box.style.maxHeight="90vh";box.style.overflow="auto";
  var h=document.createElement("h3");h.textContent="➕ ایجاد دوره جدید";box.appendChild(h);
  var l=document.createElement("label");l.textContent="نام دوره";box.appendChild(l);
  var n=document.createElement("input");n.id="npName";n.placeholder="مثلاً دوره ۱۴۰۵/۰۵";box.appendChild(n);
  var note=document.createElement("p");note.textContent="اطلاعات اولیه هر چهار سالن را وارد کنید.";box.appendChild(note);

  for(var i=1;i<=4;i++){
    var card=document.createElement("div");
    card.style.cssText="border:1px solid #394454;border-radius:12px;padding:10px;margin:8px 0";
    var b=document.createElement("b");b.textContent="سالن "+i;card.appendChild(b);

    var a=document.createElement("input");a.id="npHall"+i;a.type="number";a.min="0";a.placeholder="تعداد جوجه ورودی";card.appendChild(a);
    var d=document.createElement("input");d.id="npLoss"+i;d.type="number";d.min="0";d.placeholder="تلفات مسیر";card.appendChild(d);
    var w=document.createElement("input");w.id="npWeight"+i;w.type="number";w.min="0";w.step="0.001";w.placeholder="میانگین وزن اولیه (اختیاری)";card.appendChild(w);
    var dt=document.createElement("input");dt.id="npDate"+i;dt.placeholder="تاریخ جوجه‌ریزی شمسی";dt.readOnly=true;dt.onclick=function(){openJalaliPicker(this);};card.appendChild(dt);
    box.appendChild(card);
  }

  var actions=document.createElement("div");actions.className="jalali-actions";
  var cancel=document.createElement("button");cancel.textContent="انصراف";cancel.onclick=function(){m.remove();};actions.appendChild(cancel);
  var save=document.createElement("button");save.className="btn primary";save.textContent="ثبت دوره";save.onclick=saveNewPeriod;actions.appendChild(save);
  box.appendChild(actions);m.appendChild(box);document.body.appendChild(m);
}

function saveNewPeriod(){
  var name=document.getElementById("npName").value.trim();
  if(!name){alert("نام دوره را وارد کنید");return;}
  var periods=JSON.parse(localStorage.getItem("sepid_periods")||"[]");
  var id=String(Date.now()),halls=[];
  for(var i=1;i<=4;i++){
    var initial=Number(document.getElementById("npHall"+i).value||0);
    var loss=Number(document.getElementById("npLoss"+i).value||0);
    var weight=Number(document.getElementById("npWeight"+i).value||0);
    var entryDate=document.getElementById("npDate"+i).value.trim();
    if(!entryDate){alert("تاریخ جوجه‌ریزی سالن "+i+" را انتخاب کنید");return;}
    if(loss>initial){alert("تلفات مسیر سالن "+i+" نمی‌تواند بیشتر از تعداد ورودی باشد");return;}
    halls.push({hall:i,initial:initial,routeMortality:loss,current:Math.max(0,initial-loss),initialWeight:weight,entryDate:entryDate});
  }
  periods.push({id:id,name:name,createdAt:new Date().toISOString(),halls:halls,weeklyWeights:[],records:[]});
  localStorage.setItem("sepid_periods",JSON.stringify(periods));
  localStorage.setItem("sepid_active_period",id);
  var modal=document.getElementById("newPeriodModal");if(modal)modal.remove();
  populatePeriods();alert("دوره جدید با موفقیت ایجاد شد.");
}

function switchPeriod(id){
  if(!id)return;
  localStorage.setItem("sepid_active_period",id);
  location.reload();
}

function populatePeriods(){
  var sel=document.getElementById("periodSelect");if(!sel)return;
  var periods=JSON.parse(localStorage.getItem("sepid_periods")||"[]");
  var active=localStorage.getItem("sepid_active_period")||"";
  sel.innerHTML='<option value="">انتخاب دوره</option>';
  periods.forEach(function(p){
    var o=document.createElement("option");o.value=p.id;o.textContent=p.name;
    if(p.id===active)o.selected=true;
    sel.appendChild(o);
  });
}
</script>
</body></html>
